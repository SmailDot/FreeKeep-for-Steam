<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/stage.css" />
    <script src="/pixel.js"></script>
    <style>
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #4c6b22;
        color: #d2f26b;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
        line-height: 1;
      }
      h1 {
        color: #fff;
        margin: 0;
      }

      /* 440×280 small tile: readable at thumbnail size, so only brand + one line + privacy */
      body.small {
        width: 440px;
        height: 280px;
        padding: 0 36px;
      }
      .small .brand img {
        width: 64px;
        height: 64px;
      }
      .small h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 22px 0 20px;
      }
      .small .tag {
        font-size: 12px;
      }

      /* 1400×560 marquee: copy on the left, the real popup on the right */
      body.marquee {
        width: 1400px;
        height: 560px;
        padding: 0 110px;
        justify-content: space-between;
      }
      .marquee .brand img {
        width: 48px;
        height: 48px;
      }
      .marquee h1 {
        font-size: 48px;
        line-height: 1.25;
        margin: 26px 0 30px;
      }
      .marquee .tag {
        font-size: 24px;
        padding: 12px 16px;
      }
      .marquee .frame {
        height: 470px;
      }
    </style>
  </head>
  <body>
    <script>
      const kind = new URLSearchParams(location.search).get('kind') ?? 'small';
      document.body.className = kind;
      const brand = '<div class="brand"><img src="/icon/48.png" alt="" /><span class="name px">FreeKeep</span><span class="for px">for Steam</span></div>';
      document.body.innerHTML =
        kind === 'marquee'
          ? `<section>${brand}
               <h1 class="px">Never miss a<br><em>free Steam game</em> again.</h1>
               <div class="tag px">${pix('lock', 3)}Your credentials never leave your computer</div>
             </section>
             <div class="frame"><iframe src="/popup.html"></iframe></div>`
          : `<section>${brand}
               <h1 class="px">Never miss a<br><em>free Steam game</em></h1>
               <div class="tag px">${pix('lock', 2)}100% local · no passwords</div>
             </section>`;
    </script>
  </body>
</html>
