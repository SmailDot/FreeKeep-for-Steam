<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 700px;
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
        box-sizing: border-box;
        color: #f4f2ff;
        background:
          radial-gradient(900px 500px at 15% 10%, #5b3fd6 0%, transparent 60%),
          radial-gradient(700px 500px at 90% 100%, #0f766e 0%, transparent 60%),
          #120f24;
      }
      .copy {
        flex: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 700;
        opacity: 0;
        animation: up 0.6s 0.1s forwards;
      }
      .brand img {
        width: 52px;
        height: 52px;
      }
      .brand span {
        font-weight: 400;
        opacity: 0.7;
      }
      h1 {
        font-size: 50px;
        line-height: 1.08;
        letter-spacing: -0.02em;
        margin: 22px 0 20px;
        opacity: 0;
        animation: up 0.6s 0.3s forwards;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, #a78bfa, #34d399);
        -webkit-background-clip: text;
        color: transparent;
      }
      .privacy {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 16px 18px;
        margin: 0 0 22px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgb(34 197 94 / 0.18), rgb(34 197 94 / 0.06));
        border: 1px solid rgb(74 222 128 / 0.45);
        opacity: 0;
        animation:
          up 0.6s 0.5s forwards,
          glow 2.4s 1.2s ease-in-out infinite;
      }
      .privacy svg {
        flex: none;
        width: 34px;
        height: 34px;
        color: #4ade80;
      }
      .privacy strong {
        display: block;
        font-size: 21px;
        color: #bbf7d0;
        margin-bottom: 4px;
      }
      .privacy span {
        font-size: 15.5px;
        opacity: 0.85;
        line-height: 1.4;
      }
      @keyframes glow {
        50% {
          box-shadow: 0 0 28px rgb(74 222 128 / 0.35);
        }
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        opacity: 0;
        animation: up 0.5s forwards;
      }
      li:nth-child(1) {
        animation-delay: 0.8s;
      }
      li:nth-child(2) {
        animation-delay: 1s;
      }
      li:nth-child(3) {
        animation-delay: 1.2s;
      }
      li b {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: rgb(255 255 255 / 0.1);
        font-size: 16px;
      }
      .window {
        width: 418px;
        height: 660px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 30px 80px rgb(0 0 0 / 0.55),
          0 0 0 1px rgb(255 255 255 / 0.08);
        flex: none;
      }
      iframe {
        width: 380px;
        height: 600px;
        border: 0;
        transform: scale(1.1);
        transform-origin: 0 0;
        background: #fff;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand"><img src="/icon/128.png" alt="" />FreeKeep <span>for Steam</span></div>
      <h1 id="headline"></h1>
      <div class="privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/>
        </svg>
        <div><strong id="privacyTitle"></strong><span id="privacyBody"></span></div>
      </div>
      <ul id="points"></ul>
    </section>
    <div class="window"><iframe id="popup" src="/popup.html"></iframe></div>
    <script>
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') ?? 'en';
      const epic = {
        en: {
          headline: 'Plus <em>Epic Games</em> giveaway reminders.',
          privacyTitle: 'Optional, anonymous, off by default',
          privacyBody: "FreeKeep reads Epic's public list of free games without any login and reminds you. You claim them on Epic's site.",
          points: [
            ['🔔', 'One notification when a new Epic giveaway starts'],
            ['🗓️', "See next week's free games early"],
            ['🧩', 'Steam and Epic side by side, in separate tabs'],
          ],
        },
        zh_TW: {
          headline: '還能提醒你<br><em>Epic 限免遊戲</em>',
          privacyTitle: '選用、匿名、預設關閉',
          privacyBody: '不登入 Epic、不帶 Cookie，只讀取 Epic 公開的限免清單來提醒你；領取在 Epic 網站自己完成。',
          points: [
            ['🔔', 'Epic 新限免開始時通知你一次'],
            ['🗓️', '提前知道下週的免費遊戲'],
            ['🧩', 'Steam 與 Epic 分頁並列，一目了然'],
          ],
        },
      };
      const steam = {
        en: {
          headline: 'Never miss a <em>free Steam game</em> again.',
          privacyTitle: 'Your credentials never leave your computer',
          privacyBody: 'No password, no tokens, no server. FreeKeep runs locally and uses the Steam login already in your browser.',
          points: [
            ['⚡', 'Claims free-to-keep promos in the background'],
            ['🎯', 'Only real promotions, never demos or F2P'],
            ['🪶', 'Zero dependencies, fully open source'],
          ],
        },
        zh_TW: {
          headline: '再也不會錯過<br><em>Steam 限免遊戲</em>',
          privacyTitle: '你的帳號憑證永遠不會離開你的電腦',
          privacyBody: '不要密碼、不要 Token、沒有伺服器。FreeKeep 全程在本機執行，直接沿用瀏覽器裡的 Steam 登入。',
          points: [
            ['⚡', '在背景自動領取限時免費遊戲'],
            ['🎯', '只領真限免，不亂領試玩版和免費遊戲'],
            ['🪶', '零依賴、完全開源，程式碼人人可查'],
          ],
        },
      };
      const copy = (params.get('scene') === 'epic' ? epic : steam)[lang];
      document.getElementById('headline').innerHTML = copy.headline;
      document.getElementById('privacyTitle').textContent = copy.privacyTitle;
      document.getElementById('privacyBody').textContent = copy.privacyBody;
      document.getElementById('points').innerHTML = copy.points.map(([i, s]) => `<li><b>${i}</b>${s}</li>`).join('');
    </script>
  </body>
</html>
