<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/stage.css" />
    <script src="/pixel.js"></script>
    <style>
      html,
      body {
        width: 1200px;
        height: 700px;
      }
      body {
        gap: 64px;
        padding: 0 72px;
      }
      .copy {
        flex: 1;
        transition: opacity 0.3s steps(3, end);
      }
      /* Top-aligned, so the popup grows downwards like the real one instead of jumping around. */
      .frame {
        align-self: flex-start;
        margin-top: 50px;
      }
      .brand img {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 48px;
        line-height: 1.25;
        color: #fff;
        margin: 22px 0 24px;
      }
      .box.bad + ul em,
      body.problem h1 em {
        color: var(--bad);
      }
      .box span {
        font-size: 16px;
        line-height: 1.45;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 26px 0 0;
        display: grid;
        gap: 12px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 18px;
      }
      li b {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        background: #1b2838;
        border: 3px solid #000;
        color: var(--blue);
        line-height: 0;
      }
      .brand,
      h1,
      .box,
      li {
        opacity: 0;
        animation: up 0.4s steps(4, end) forwards;
      }
      h1 {
        animation-delay: 0.15s;
      }
      .box {
        animation-delay: 0.3s;
      }
      li:nth-child(1) {
        animation-delay: 0.6s;
      }
      li:nth-child(2) {
        animation-delay: 0.75s;
      }
      li:nth-child(3) {
        animation-delay: 0.9s;
      }
      body.swap .copy {
        opacity: 0;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand"><img src="/icon/48.png" alt="" /><span class="name px">FreeKeep</span><span class="for px">for Steam</span></div>
      <h1 id="headline" class="px"></h1>
      <div id="box" class="box">
        <span id="boxIcon" class="ic"></span>
        <div><strong id="privacyTitle" class="px"></strong><span id="privacyBody"></span></div>
      </div>
      <ul id="points"></ul>
    </section>
    <div class="frame"><iframe id="popup" src="/popup.html"></iframe></div>
    <script>
      fitFrame(document.getElementById('popup'));
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') ?? 'en';
      // steam / epic: the store screenshots. problem → how → claim → epic → proof: the README demo.
      const scenes = {
        steam: {
          en: {
            headline: 'Never miss a <em>free Steam game</em> again.',
            privacyTitle: 'Your credentials never leave your computer',
            privacyBody: 'No password, no tokens, no server. FreeKeep runs locally and uses the Steam login already in your browser.',
            points: [
              ['bolt', 'Claims free-to-keep promos in the background'],
              ['check', 'Only real promotions, never demos or F2P'],
              ['book', 'Zero dependencies, fully open source'],
            ],
          },
          zh_TW: {
            headline: '再也不會錯過<br><em>Steam 限免遊戲</em>',
            privacyTitle: '你的帳號憑證永遠不會離開你的電腦',
            privacyBody: '不需密碼或 Token，也沒有伺服器。FreeKeep 完全在本機執行，沿用瀏覽器既有的 Steam 登入。',
            points: [
              ['bolt', '在背景自動領取限時免費遊戲'],
              ['check', '只領取真正的限免，不含試玩版與免費遊玩遊戲'],
              ['book', '無第三方依賴，原始碼完整公開'],
            ],
          },
        },
        epic: {
          en: {
            headline: 'Plus <em>Epic Games</em> giveaway reminders.',
            privacyTitle: 'Optional, anonymous, off by default',
            privacyBody: "FreeKeep reads Epic's public list of free games without any login and reminds you. You claim them on Epic's site.",
            points: [
              ['bell', 'One notification when a new Epic giveaway starts'],
              ['clock', "See next week's free games early"],
              ['tabs', 'Steam and Epic side by side, in separate tabs'],
            ],
          },
          zh_TW: {
            headline: '還能提醒你<br><em>Epic 限免遊戲</em>',
            privacyTitle: '選用、匿名、預設關閉',
            privacyBody: '不需登入 Epic，只讀取公開的限免清單並提醒你；領取在 Epic 網站完成。',
            points: [
              ['bell', 'Epic 新限免開始時通知你一次'],
              ['clock', '提前知道下週的免費遊戲'],
              ['tabs', 'Steam 與 Epic 分頁並列，一目了然'],
            ],
          },
        },
        problem: {
          tone: 'bad',
          en: {
            headline: 'Many auto-claimers need your <em>password</em>.',
            privacyTitle: 'Your account security then depends on a third party',
            privacyBody: 'Passwords, tokens or login cookies get stored in a bot, on a server or in a config file.',
            points: [
              ['key', 'Password stored in a config file'],
              ['cookie', 'Login cookies kept on a remote server'],
              ['tabs', 'A browser tab opened for every game'],
            ],
          },
          zh_TW: {
            headline: '許多自動領取工具<br>需要你的<em>密碼</em>',
            privacyTitle: '帳號安全因此取決於第三方',
            privacyBody: '密碼、Token 或登入 Cookie 會被存放在機器人、伺服器或設定檔中。',
            points: [
              ['key', '密碼存放在設定檔中'],
              ['cookie', '登入 Cookie 存放在遠端伺服器'],
              ['tabs', '每款遊戲各開啟一個分頁'],
            ],
          },
        },
        how: {
          en: {
            headline: 'FreeKeep <em>never sees</em> your login.',
            privacyTitle: 'It reuses your browser session',
            privacyBody: 'Your browser attaches your Steam session. Steam protects the login cookie with HttpOnly, so extensions can\'t read it, and FreeKeep doesn\'t request cookie access.',
            points: [
              ['key', 'No password'],
              ['cookie', 'No cookie access'],
              ['server', 'No server'],
            ],
          },
          zh_TW: {
            headline: 'FreeKeep <em>讀不到</em><br>你的登入資料',
            privacyTitle: '沿用瀏覽器既有的登入狀態',
            privacyBody: '由瀏覽器自動附上 Steam 登入狀態。登入憑證受 HttpOnly 保護，擴充功能無法讀取，FreeKeep 也未申請 Cookie 權限。',
            points: [
              ['key', '不需密碼'],
              ['cookie', '不讀取 Cookie'],
              ['server', '沒有伺服器'],
            ],
          },
        },
        claim: {
          en: {
            headline: 'Free Steam games, claimed <em>in the background</em>.',
            privacyTitle: 'A single request, no tabs',
            privacyBody: 'The same request as Steam\'s "Add to Account" button, sent in the background.',
            points: [
              ['check', 'Genuine free-to-keep promotions only'],
              ['tabs', 'Skips owned games, checks DLC base games'],
              ['bell', 'Notifies you only when needed'],
            ],
          },
          zh_TW: {
            headline: '在<em>背景</em>自動領取<br>Steam 限免遊戲',
            privacyTitle: '單一請求，不開分頁',
            privacyBody: '與 Steam「加入帳戶」按鈕相同的請求，在背景完成。',
            points: [
              ['check', '只領取真正的限時免費'],
              ['tabs', '略過已擁有的遊戲，DLC 會確認本體'],
              ['bell', '只在必要時通知'],
            ],
          },
        },
        renew: {
          en: {
            headline: 'Steam login expired? <em>One click.</em>',
            privacyTitle: "Steam's web login lasts 24 hours",
            privacyBody: "FreeKeep's background checks don't renew it, so you choose how: one click, automatically, or just a reminder.",
            points: [
              ['cursor', 'One click, done in a background tab'],
              ['renew', 'Or fully automatic (optional)'],
              ['bell', 'Or only a reminder'],
            ],
          },
          zh_TW: {
            headline: 'Steam 登入過期？<br><em>一鍵</em>續期',
            privacyTitle: 'Steam 網頁登入每 24 小時到期',
            privacyBody: 'FreeKeep 在背景檢查不會觸發續期，所以由你選：一鍵續期、自動續期，或只提醒。',
            points: [
              ['cursor', '點一下，在背景分頁完成'],
              ['renew', '或全自動續期（選用）'],
              ['bell', '或只提醒'],
            ],
          },
        },
        proof: {
          en: {
            headline: 'Transparent and <em>verifiable</em>.',
            privacyTitle: 'Chrome → Extensions → Details',
            privacyBody: "Shows only notifications and access to the Steam store (plus Epic's public list, if enabled).",
            points: [
              ['book', 'Open source, about 45 KB of code'],
              ['globe', '12 languages'],
              ['coin', 'Free, MIT licensed'],
            ],
          },
          zh_TW: {
            headline: '公開透明<br><em>隨時可查證</em>',
            privacyTitle: 'Chrome 擴充功能 → 詳細資料',
            privacyBody: '只會看到通知權限與 Steam 商店的存取權（開啟 Epic 提醒時另含 Epic 公開清單）。',
            points: [
              ['book', '開源，程式碼約 45 KB'],
              ['globe', '12 種語言'],
              ['coin', '免費，MIT 授權'],
            ],
          },
        },
      };
      function render(name) {
        const scene = scenes[name] ?? scenes.steam;
        const copy = scene[lang];
        const bad = scene.tone === 'bad';
        document.body.classList.toggle('problem', bad);
        document.getElementById('box').classList.toggle('bad', bad);
        document.getElementById('boxIcon').innerHTML = pix(bad ? 'warn' : 'lock', 3);
        document.getElementById('headline').innerHTML = copy.headline;
        document.getElementById('privacyTitle').textContent = copy.privacyTitle;
        document.getElementById('privacyBody').textContent = copy.privacyBody;
        document.getElementById('points').innerHTML = copy.points.map(([i, s]) => `<li><b>${pix(i, 3)}</b>${s}</li>`).join('');
      }
      render(params.get('scene'));
      window.showScene = (scene) => {
        document.body.classList.add('swap');
        setTimeout(() => {
          render(scene);
          document.body.classList.remove('swap');
          // Replay the entrance animation for the new copy.
          document.querySelectorAll('.copy > *, li').forEach((el) => {
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';
          });
        }, 320);
      };
    </script>
  </body>
</html>
