name: Bug report
description: Something didn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Open the FreeKeep popup, click "Copy diagnostics" and paste it here. It contains no account data.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 154, Edge 154, Brave …
