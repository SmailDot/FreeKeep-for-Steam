name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run zip
      # Firefox build plus the sources zip addons.mozilla.org asks for (the code is bundled).
      - run: npm run zip:firefox
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd .output
          sha256sum *-chrome.zip *-firefox.zip *-sources.zip > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release written by hand in the web UI: keep its notes, attach the builds and checksums.
            gh release upload "$GITHUB_REF_NAME" *-chrome.zip *-firefox.zip *-sources.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" *-chrome.zip *-firefox.zip *-sources.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --title "FreeKeep for Steam $GITHUB_REF_NAME" --generate-notes
          fi
