<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeKeep for Steam</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <header class="top">
      <span id="logo" class="logo"></span>
      <div class="brand"><span class="px-lg">FreeKeep</span><span class="px">for Steam</span></div>
      <button id="settings" class="icon-btn" type="button"><i data-pi="gear"></i></button>
    </header>

    <section class="hud">
      <div class="hud-line px">
        <span id="dot" class="dot"></span>
        <span id="statusText"></span>
      </div>
      <div class="hud-sub">
        <span id="lastCheck"></span>
        <button id="checkNow" class="pbtn" type="button"><span data-i18n="popupCheckNow"></span></button>
      </div>
    </section>

    <section id="login" class="dlg" hidden>
      <div id="loginTitle" class="dlg-title px"></div>
      <p id="loginBody"></p>
      <div id="loginActions" class="dlg-actions"></div>
    </section>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="fx" class="fx" aria-hidden="true"></div>

    <nav id="tabs" class="tabs" role="tablist" hidden>
      <button id="tabSteam" class="px" type="button" role="tab" aria-controls="steamPanel" aria-selected="true">
        Steam <span id="countSteam" class="count"></span>
      </button>
      <button id="tabEpic" class="px" type="button" role="tab" aria-controls="epicWrap" aria-selected="false">
        Epic Games <span id="countEpic" class="count"></span>
      </button>
      <button id="tabGog" class="px" type="button" role="tab" aria-controls="gogWrap" aria-selected="false">
        GOG <span id="countGog" class="count"></span>
      </button>
    </nav>

    <div id="steamPanel" role="tabpanel" aria-labelledby="tabSteam">
      <main id="list"></main>

      <section id="empty" class="empty" hidden>
        <span id="emptyIcon"></span>
        <strong class="px" data-i18n="popupEmptyTitle"></strong>
        <p id="emptyBody"></p>
      </section>

      <section id="recentWrap" hidden>
        <h2 class="sec px"><span data-i18n="popupRecent"></span></h2>
        <ul id="recent"></ul>
      </section>
    </div>

    <section id="epicWrap" class="remind" role="tabpanel" aria-labelledby="tabEpic" hidden>
      <p class="remind-lead px" data-i18n="epicReminderOnly"></p>
      <p id="epicNotice" class="remind-notice" hidden></p>
      <div id="epicList" class="remind-list"></div>
      <p id="epicNext" class="remind-next" hidden></p>
    </section>

    <section id="gogWrap" class="remind" role="tabpanel" aria-labelledby="tabGog" hidden>
      <p class="remind-lead px" data-i18n="gogReminderOnly"></p>
      <p id="gogNotice" class="remind-notice" hidden></p>
      <div id="gogList" class="remind-list"></div>
    </section>

    <p class="privacy"><i data-pi="lock" data-scale="1.5"></i><span data-i18n="popupPrivacy"></span></p>

    <footer>
      <button id="diagnostics" class="link px" type="button" data-i18n="popupDiagnostics"></button>
      <a class="px" href="https://github.com/SmailDot/FreeKeep-for-Steam" target="_blank" rel="noreferrer" data-i18n="popupSource"></a>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
